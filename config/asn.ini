; =============================================================================
; Uniface Assignment File (asn.ini)
; Project: UnifaceWebClientTwitterX
;
; This file configures the Uniface runtime environment for the X API client.
; Copy this file to your Uniface working directory or reference it via the
; -asn command-line parameter when starting the Uniface server.
; =============================================================================

[UNIFACE]
; --- Path Assignments ---

; Root directory of this project
HOME        = /home/user/UnifaceWebClientTwitterX

; Component directories — production components and test components separated by ";"
; Remove the src/tests entry for production deployments to exclude test code.
LIBPATH     = /home/user/UnifaceWebClientTwitterX/src/components;/home/user/UnifaceWebClientTwitterX/src/tests

; Log output directory — must exist at runtime; XAPI_LOGGER writes here
LOGDIR      = /home/user/UnifaceWebClientTwitterX/log

; Full path to the application configuration file (bearer token, log level)
; XAPI_CLIENT.INITIALIZE reads this via $getconfigkey()
XAPICONF    = /home/user/UnifaceWebClientTwitterX/config/xapi.ini

; DSP web pages directory
DSPDIR      = /home/user/UnifaceWebClientTwitterX/src/dsp

[SERVICES]
; Declare the logical HTTP service name used by XAPI_HTTP_CLIENT.
; The Uniface built-in HTTP connector handles actual HTTPS transport.
TWITTER_API = http

[TWITTER_API]
; Base URL for X/Twitter API v2
url         = https://api.twitter.com
; Request timeout in seconds (overridden by xapi.ini TIMEOUT setting)
timeout     = 30
; Enable SSL/TLS certificate verification
ssl_verify  = 1

[TRACE]
; Uniface trace output level for the trace facility.
; 0 = off, 1 = errors only, 2 = warnings, 3 = info, 4 = debug/all
; Application-level logging (TRACE/INFO/ERROR) is separate and controlled
; via xapi.ini LOG_LEVEL — this only affects the Uniface trace facility output.
level       = 2
file        = /home/user/UnifaceWebClientTwitterX/log/uniface_trace.log
